[about]
## Author / Copyright notice
author=your name

description=Ctrl+E exports the current page as a PNG (150 dpi, transparent background). Lecture flow: F7 appends queued problem pages to the open lecture .xopp; Ctrl+E writes the annotated page tight back to that problem's note image (works after restart and for continuation pages). Legacy: F8 inserts the latest note image on an A4 page.

## If the plugin is packed with Xournal++, use
## <xournalpp> then it gets the same version number
version=0.3

[default]
enabled=true

[plugin]
mainfile=main.lua
