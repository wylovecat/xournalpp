[about]
## Author / Copyright notice
author=your name

description=Ctrl+E exports the current page as a PNG (150 dpi, transparent background) without going through the export settings dialog. The OI whiteboard bridge (F8) inserts the latest note images on A4 pages; Ctrl+E writes the annotated page back to the source PNG cropped to its content (no large blank top/bottom).

## If the plugin is packed with Xournal++, use
## <xournalpp> then it gets the same version number
version=0.1

[default]
enabled=true

[plugin]
mainfile=main.lua
